name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: registry.syeyoung.dev/assistant/assistant-api

jobs:
  test:
    # The runner image has Node (needed by actions like checkout); Java comes from setup-java.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: postgres
    env:
      TEST_DB_HOST: postgres
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew --no-daemon test
      - name: OpenAPI spec is up to date
        run: git diff --exit-code openapi.json

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: registry.syeyoung.dev
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Tag
        id: tag
        # <run number>-<short sha>: Flux picks the highest run number.
        run: echo "tag=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
