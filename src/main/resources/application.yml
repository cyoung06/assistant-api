spring:
  application:
    name: assistant-api
  r2dbc:
    url: ${DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/assistant}
    username: ${DB_USERNAME:assistant}
    password: ${DB_PASSWORD:assistant}
  flyway:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/assistant}
    user: ${DB_USERNAME:assistant}
    password: ${DB_PASSWORD:assistant}
  webflux:
    problemdetails:
      enabled: true

app:
  zone: Asia/Seoul
  public-url: ${PUBLIC_URL:http://localhost:5173}
  public-host: ${PUBLIC_HOST:}
  sources:
    scheduler-enabled: ${SOURCES_SCHEDULER_ENABLED:true}
    plms:
      enabled: ${PLMS_ENABLED:false}
      username: ${PLMS_USERNAME:}
      password: ${PLMS_PASSWORD:}
    ical:
      subscriptions:
        - key: kr-holidays
          name: Korean holidays
          url: https://calendar.google.com/calendar/ical/ko.south_korea%23holiday%40group.v.calendar.google.com/public/basic.ics
          tag: holiday
    mail:
      client-id: ${MAIL_CLIENT_ID:}
      # "organizations" for a multi-tenant app; a single-tenant app needs its directory (tenant) ID.
      tenant: ${MAIL_TENANT:organizations}
      token-key: ${MAIL_TOKEN_KEY:}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-key: ${GITHUB_APP_KEY:}
  llm:
    model: ${LLM_MODEL:gpt-6-luna}
  dav:
    url: ${DAV_URL:http://localhost:5232}
    username: ${DAV_USERNAME:}
    password: ${DAV_PASSWORD:}
  drive:
    url: ${DRIVE_URL:}
    public-url: ${DRIVE_PUBLIC_URL:}
    username: ${DRIVE_USERNAME:}
    password: ${DRIVE_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Responses are JSON (not */*), so generated clients decode them.
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
